{# Start picker + duration dropdown, shared by the reserve and edit forms.
   static/reserve.js turns the start field into a flatpickr calendar and, on submit,
   fills the hidden start_time/end_time fields (UTC) from start + duration. #}
<label>Start
  <input type="text" class="js-start" placeholder="Pick a date and time" autocomplete="off">
</label>
<label>Duration
  <select class="js-duration">
    <option value="15">15 minutes</option>
    <option value="30">30 minutes</option>
    <option value="45">45 minutes</option>
    <option value="60" selected>1 hour</option>
    <option value="90">1.5 hours</option>
    <option value="120">2 hours</option>
    <option value="180">3 hours</option>
    <option value="240">4 hours</option>
    <option value="480">8 hours</option>
    <option value="1440">1 day</option>
    <option value="2880">2 days</option>
    <option value="10080">1 week</option>
  </select>
</label>
<p class="hint js-end-preview" aria-live="polite"></p>
<div class="conflict js-conflict" role="alert" hidden></div>
<input type="hidden" name="start_time">
<input type="hidden" name="end_time">
<noscript><p class="conflict">JavaScript is required to pick reservation times.</p></noscript>
