{% extends "base.html" %}
{% block title %}Log out{% endblock %}
{% block content %}
  <h1>Log out?</h1>
  <form method="post" action="{{ url_for('auth.logout') }}" class="card">
    {{ csrf_field() }}
    <p>You're signed in as <strong>{{ g.user['username'] }}</strong>.</p>
    <button type="submit">Log out</button>
  </form>
{% endblock %}
